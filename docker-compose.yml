version: '3.8'

services:
  roviers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roviers-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info,roviers_core=info,roviers_server=info
    volumes:
      - roviers_data:/var/lib/roviers
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  roviers_data:

