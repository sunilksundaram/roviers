name: Roviers Automated Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # 1. Build and Package Native Binaries for Major Platforms
  build_binaries:
    name: Build Native Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: roviers-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: roviers-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: roviers-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }} -p roviers-server -p roviers-cli

      - name: Package Binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }} roviers-server roviers-cli

      - name: Package Binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path roviers-server.exe, roviers-cli.exe -DestinationPath ../../../${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # 2. Create GitHub Release with Attached Binaries
  create_github_release:
    name: Publish GitHub Release
    needs: build_binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Publish Crates to Crates.io (In Topological Dependency Order)
  publish_crates:
    name: Publish to Crates.io
    needs: build_binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish roviers-proto
        run: |
          cargo publish -p roviers-proto --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 20

      - name: Publish roviers-ledger
        run: |
          cargo publish -p roviers-ledger --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 20

      - name: Publish roviers-core
        run: |
          cargo publish -p roviers-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 20

      - name: Publish roviers-server
        run: |
          cargo publish -p roviers-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          sleep 20

      - name: Publish roviers-cli
        run: |
          cargo publish -p roviers-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # 4. Publish Python Package & Installer to PyPI
  publish_pypi:
    name: Publish Python SDK & Installer to PyPI
    needs: build_binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Build Tools
        run: python -m pip install --upgrade pip build twine

      - name: Build Source Distribution and Wheel
        run: |
          cd clients/python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
