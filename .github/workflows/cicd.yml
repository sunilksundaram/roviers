name: Roviers CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. Security Audit
  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 2. Rust Unit, Integration & Regression Testing
  rust_tests:
    name: Rust Unit, Integration & Regression Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit Tests
        run: cargo test --lib

      - name: Integration Tests (HTTP Server & E2E)
        run: cargo test --test server_e2e

      - name: Regression Suite (Compile Criterion Benchmarks)
        run: cargo bench --no-run -p roviers-core

  # 3. Python Client SDK & Installer Testing
  python_sdk:
    name: Python SDK & Installer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          pip install ./clients/python

      - name: Test Python Package Build
        run: |
          cd clients/python
          python -m build

      - name: Verify Python CLI Entrypoint
        run: |
          python -m roviers which

  # 4. TypeScript Client SDK Typecheck & Build
  typescript_sdk:
    name: TypeScript SDK Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build TypeScript SDK
        run: |
          cd clients/typescript
          npm install
          npm run build

